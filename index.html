<!DOCTYPE html>
<html>
<head>
    <title>Home Inventory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🏠 Home Inventory</h1>
</header>

<nav class="tabs">
    <button class="tab-btn active" onclick="showTab('inventory', this)">Inventory</button>
    <button class="tab-btn" onclick="showTab('shopping', this)">Shopping</button>
</nav>

<main>

<!-- INVENTORY -->
<div id="inventory" class="tab">
    <div class="card">

        <h2>Inventory</h2>

        <div class="inventory-layout">

            <!-- LEFT PANEL -->
            <div class="add-panel">
                <h3>Add Item</h3>

                <input id="item" placeholder="Item">
                <input id="quantity" type="number" placeholder="Quantity">

                <select id="unit">
                    <option value="kg">kgs</option>
                    <option value="grams">grams</option>
                    <option value="packets">packets</option>
                    <option value="nos">nos</option>
                </select>

                <button class="cta" onclick="addItemToInventory()">Add to Inventory</button>
                <button class="cta" onclick="clearInventory()">Clear All</button>
            </div>

            <!-- RIGHT PANEL -->
            <div id="inventoryList" class="inventory-table"></div>

        </div>

    </div>
</div>

<!-- SHOPPING (UNCHANGED) -->
<div id="shopping" class="tab">
    <div class="card">
        <h2>Shopping List</h2>

        <div class="row">
            <input id="itemInput" placeholder="Add item">
            <button class="primary" onclick="addItem()">Add</button>
        </div>

        <ul id="shoppingList"></ul>

        <button onclick="clearShopping()" class="cta">
            Clear All
        </button>
    </div>
</div>

</main>

<script type="module" src="script.js"></script>

</body>
</html>
