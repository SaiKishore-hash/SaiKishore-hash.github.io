<!DOCTYPE html>
<html>
<head>
    <title>Home Inventory</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#2563eb">
</head>

<body>

<header>
    <h1>🏠 Home Inventory</h1>
</header>

<nav class="tabs">
    <button class="tab-btn active" onclick="showTab('inventory', this)">
        Inventory
    </button>

    <button class="tab-btn" onclick="showTab('shopping', this)">
        Shopping
    </button>

    <button class="tab-btn" onclick="showTab('purchases', this)">
        Purchases
    </button>
</nav>

<main>

<!-- INVENTORY -->
<div id="inventory" class="tab">

    <div class="card">

        <h2>Inventory</h2>

        <div class="inventory-layout">

            <!-- LEFT -->
            <div class="add-panel">

                <h3>Add Item</h3>

                <!-- QUICK CHIPS -->
                <div class="quick-chips">
                    <button onclick="quickFill('milk','packets')">Milk</button>
                    <button onclick="quickFill('rice','kg')">Rice</button>
                    <button onclick="quickFill('curd','packets')">Curd</button>
                </div>

                <input id="item" placeholder="Item">

                <input
                    id="quantity"
                    type="number"
                    step="0.1"
                    placeholder="Quantity"
                >

                <select id="unit">
                    <option value="kg">kgs</option>
                    <option value="grams">grams</option>
                    <option value="packets">packets</option>
                    <option value="nos">nos</option>
                </select>

                <button class="cta" onclick="addItemToInventory()">
                    Add to Inventory
                </button>

                <button class="danger" onclick="clearInventory()">
                    Clear Inventory
                </button>

            </div>

            <!-- RIGHT -->
            <div id="inventoryList" class="inventory-grid"></div>

        </div>

    </div>

</div>

<!-- SHOPPING -->
<div id="shopping" class="tab">

    <div class="card">

        <h2>Shopping List</h2>

        <div class="row">
            <input id="itemInput" placeholder="Add item">

            <button class="primary" onclick="addItem()">
                Add
            </button>
        </div>

        <ul id="shoppingList"></ul>

        <button onclick="clearShopping()" class="cta">
            Clear All
        </button>

    </div>

</div>

<!-- PURCHASES -->
<div id="purchases" class="tab">

    <div class="card">

        <h2>Purchases</h2>

        <div class="purchase-form">

            <input id="purchaseItem" placeholder="Item">

            <input id="purchaseQty" placeholder="Quantity (example: 2 packets)">

            <input id="purchaseCost" placeholder="Cost">

            <input id="purchaseStore" placeholder="Store">

            <input id="purchaseDate" type="date">

            <button class="cta" onclick="addPurchase()">
                Add Purchase
            </button>

        </div>

        <div id="purchaseList"></div>

    </div>

</div>

</main>

<script type="module" src="script.js"></script>

</body>
</html>
